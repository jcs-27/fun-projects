<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Falling Sand</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg: #08090d; --panel: rgba(20, 22, 30, 0.78); --text: #e8e9ee;
    --muted: #9aa0ad; --accent-strong: #38bdf8; --accent: #7dd3fc;
    --border: rgba(255,255,255,0.10);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--bg); overflow: hidden; }
  body { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: var(--text); }
  #stage { display: block; width: 100vw; height: 100vh; background: #0b0c10; cursor: crosshair; image-rendering: pixelated; }

  .panel {
    position: fixed; top: 16px; left: 16px;
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    padding: 14px 16px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    display: flex; flex-direction: column; gap: 10px; min-width: 230px;
  }
  .panel h1 { font-size: 13px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); margin: 0; }
  .materials { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .matBtn {
    padding: 8px 4px; border-radius: 8px; border: 1px solid var(--border);
    background: rgba(255,255,255,0.06); color: var(--text); font-size: 12px; cursor: pointer;
  }
  .matBtn.active { outline: 2px solid var(--accent-strong); outline-offset: -2px; }
  .row { display: flex; gap: 8px; }
  button.action {
    flex: 1; background: rgba(255,255,255,0.06); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px;
    font-size: 13px; cursor: pointer;
  }
  button.action:hover { background: rgba(255,255,255,0.12); }
  button.action.primary { background: var(--accent-strong); color: #07131a; border-color: var(--accent-strong); font-weight: 600; }
  label { font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; }
  input[type="range"] { width: 100%; accent-color: var(--accent-strong); }
  .hint { font-size: 11px; color: var(--muted); line-height: 1.5; }
  .stats { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<canvas id="stage"></canvas>

<div class="panel">
  <h1>Falling Sand</h1>
  <div class="materials" id="materials"></div>
  <label>Brush size <span id="brushLabel">3</span>
    <input type="range" id="brushSize" min="1" max="10" step="1" value="3">
  </label>
  <div class="row">
    <button class="action primary" id="pauseBtn">⏸ Pause</button>
    <button class="action" id="clearBtn">✕ Clear</button>
  </div>
  <div class="hint">Click and drag to place material. Fire burns wood; sand sinks through water.</div>
  <div class="stats" id="stats"></div>
</div>

<script>
(() => {
  "use strict";

  // ===================================================================
  // simulation core — pure grid logic, no DOM/canvas dependencies here.
  // This exact block is what gets extracted and unit-tested in Node
  // (see the project README) so the tested code and shipped code never
  // drift apart.
  // ===================================================================

  const EMPTY = 0, SAND = 1, WATER = 2, WALL = 3, WOOD = 4, FIRE = 5, SMOKE = 6;
  const MATERIAL_NAMES = { [EMPTY]: "Eraser", [SAND]: "Sand", [WATER]: "Water", [WALL]: "Wall", [WOOD]: "Wood", [FIRE]: "Fire" };

  const FIRE_LIFE = 25;
  const SMOKE_LIFE = 35;
  const IGNITE_CHANCE = 0.05;

  function idx(row, col, cols) { return row * cols + col; }
  function inBounds(row, col, cols, rows) { return row >= 0 && row < rows && col >= 0 && col < cols; }

  function swap(grid, life, a, b) {
    const gt = grid[a]; grid[a] = grid[b]; grid[b] = gt;
    const lt = life[a]; life[a] = life[b]; life[b] = lt;
  }

  function trySand(grid, life, row, col, cols, rows, rng) {
    const here = idx(row, col, cols);
    const belowRow = row + 1;
    if (inBounds(belowRow, col, cols, rows)) {
      const below = idx(belowRow, col, cols);
      if (grid[below] === EMPTY || grid[below] === WATER) { swap(grid, life, here, below); return; }
    }
    const order = rng() < 0.5 ? [-1, 1] : [1, -1];
    for (const dcol of order) {
      const dcolAbs = col + dcol;
      if (!inBounds(belowRow, dcolAbs, cols, rows)) continue;
      const diag = idx(belowRow, dcolAbs, cols);
      if (grid[diag] === EMPTY || grid[diag] === WATER) { swap(grid, life, here, diag); return; }
    }
  }

  function tryWater(grid, life, row, col, cols, rows, rng) {
    const here = idx(row, col, cols);
    const belowRow = row + 1;
    if (inBounds(belowRow, col, cols, rows)) {
      const below = idx(belowRow, col, cols);
      if (grid[below] === EMPTY) { swap(grid, life, here, below); return; }
    }
    const order = rng() < 0.5 ? [-1, 1] : [1, -1];
    for (const dcol of order) {
      const dcolAbs = col + dcol;
      if (!inBounds(belowRow, dcolAbs, cols, rows)) continue;
      const diag = idx(belowRow, dcolAbs, cols);
      if (grid[diag] === EMPTY) { swap(grid, life, here, diag); return; }
    }
    for (const dcol of order) {
      const dcolAbs = col + dcol;
      if (!inBounds(row, dcolAbs, cols, rows)) continue;
      const side = idx(row, dcolAbs, cols);
      if (grid[side] === EMPTY) { swap(grid, life, here, side); return; }
    }
  }

  function tryFire(grid, life, row, col, cols, rows, rng) {
    const here = idx(row, col, cols);
    life[here]--;
    if (life[here] <= 0) {
      if (rng() < 0.5) { grid[here] = SMOKE; life[here] = SMOKE_LIFE; }
      else { grid[here] = EMPTY; life[here] = 0; }
      return;
    }
    const neighbors = [[row - 1, col], [row + 1, col], [row, col - 1], [row, col + 1]];
    for (const [nr, nc] of neighbors) {
      if (!inBounds(nr, nc, cols, rows)) continue;
      const n = idx(nr, nc, cols);
      if (grid[n] === WOOD && rng() < IGNITE_CHANCE) {
        grid[n] = FIRE;
        life[n] = FIRE_LIFE;
      }
    }
  }

  function trySmoke(grid, life, row, col, cols, rows, rng) {
    const here = idx(row, col, cols);
    life[here]--;
    if (life[here] <= 0) { grid[here] = EMPTY; return; }
    const aboveRow = row - 1;
    if (inBounds(aboveRow, col, cols, rows)) {
      const above = idx(aboveRow, col, cols);
      if (grid[above] === EMPTY) { swap(grid, life, here, above); return; }
    }
    const order = rng() < 0.5 ? [-1, 1] : [1, -1];
    for (const dcol of order) {
      const dcolAbs = col + dcol;
      if (!inBounds(aboveRow, dcolAbs, cols, rows)) continue;
      const diag = idx(aboveRow, dcolAbs, cols);
      if (grid[diag] === EMPTY) { swap(grid, life, here, diag); return; }
    }
  }

  // Advances the simulation by exactly one tick. Rows are processed
  // bottom-to-top specifically so a cell that falls into the row below
  // (already processed this tick) is never re-processed in the same
  // tick — without this a falling particle can drop multiple rows in
  // a single step, which both looks wrong and breaks determinism.
  function step(grid, life, cols, rows, tick, rng) {
    for (let row = rows - 1; row >= 0; row--) {
      const leftToRight = tick % 2 === 0;
      for (let i = 0; i < cols; i++) {
        const col = leftToRight ? i : cols - 1 - i;
        const here = idx(row, col, cols);
        const mat = grid[here];
        if (mat === SAND) trySand(grid, life, row, col, cols, rows, rng);
        else if (mat === WATER) tryWater(grid, life, row, col, cols, rows, rng);
        else if (mat === FIRE) tryFire(grid, life, row, col, cols, rows, rng);
        else if (mat === SMOKE) trySmoke(grid, life, row, col, cols, rows, rng);
        // WALL, WOOD, EMPTY: no per-tick behavior of their own
      }
    }
  }

  // exposed for the Node test harness to import verbatim
  if (typeof module !== "undefined" && module.exports) {
    module.exports = { EMPTY, SAND, WATER, WALL, WOOD, FIRE, SMOKE, step, idx, inBounds };
  }

  // ===================================================================
  // page wiring — only runs in a browser (module.exports is undefined there)
  // ===================================================================
  if (typeof module !== "undefined" && module.exports) return;

  const canvas = document.getElementById("stage");
  const ctx = canvas.getContext("2d");
  const CELL = 5;
  let cols = 0, rows = 0;
  let grid, life;
  let dpr = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
  let tick = 0;
  let paused = false;
  let currentMaterial = SAND;
  let brushSize = 3;

  function resize() {
    const w = window.innerWidth, h = window.innerHeight;
    cols = Math.floor(w / CELL);
    rows = Math.floor(h / CELL);
    canvas.width = cols * CELL;
    canvas.height = rows * CELL;
    canvas.style.width = (cols * CELL) + "px";
    canvas.style.height = (rows * CELL) + "px";
    const newGrid = new Uint8Array(cols * rows);
    const newLife = new Uint8Array(cols * rows);
    // preserve existing content on resize where it still fits, rather than
    // wiping the whole canvas every time the window changes size
    if (grid) {
      const oldCols = window.__prevCols || cols, oldRows = window.__prevRows || rows;
      for (let r = 0; r < Math.min(rows, oldRows); r++) {
        for (let c = 0; c < Math.min(cols, oldCols); c++) {
          newGrid[idx(r, c, cols)] = grid[idx(r, c, oldCols)];
          newLife[idx(r, c, cols)] = life[idx(r, c, oldCols)];
        }
      }
    }
    grid = newGrid; life = newLife;
    window.__prevCols = cols; window.__prevRows = rows;
  }

  const COLORS = {
    [EMPTY]: null,
    [SAND]: [237, 201, 108],
    [WATER]: [64, 140, 220],
    [WALL]: [90, 92, 100],
    [WOOD]: [120, 78, 42],
    [FIRE]: [255, 120, 30],
    [SMOKE]: [130, 130, 140],
  };

  function render() {
    const img = ctx.createImageData(canvas.width, canvas.height);
    const data = img.data;
    for (let row = 0; row < rows; row++) {
      for (let col = 0; col < cols; col++) {
        const mat = grid[idx(row, col, cols)];
        const color = COLORS[mat];
        if (!color) continue;
        let [r, g, b] = color;
        if (mat === SAND) { const jitter = ((row * 7 + col * 13) % 15) - 7; r += jitter; g += jitter * 0.7; }
        if (mat === FIRE) { const flick = Math.floor(Math.random() * 40) - 20; r = Math.min(255, r + flick); g = Math.max(0, g + flick); }
        for (let py = 0; py < CELL; py++) {
          for (let px = 0; px < CELL; px++) {
            const x = col * CELL + px, y = row * CELL + py;
            const i = (y * canvas.width + x) * 4;
            data[i] = r; data[i + 1] = g; data[i + 2] = b; data[i + 3] = 255;
          }
        }
      }
    }
    ctx.putImageData(img, 0, 0);
  }

  function paintAt(clientX, clientY) {
    const rect = canvas.getBoundingClientRect();
    const x = (clientX - rect.left) * (canvas.width / rect.width);
    const y = (clientY - rect.top) * (canvas.height / rect.height);
    const centerCol = Math.floor(x / CELL);
    const centerRow = Math.floor(y / CELL);
    const r2 = brushSize * brushSize;
    for (let dr = -brushSize; dr <= brushSize; dr++) {
      for (let dc = -brushSize; dc <= brushSize; dc++) {
        if (dr * dr + dc * dc > r2) continue;
        const row = centerRow + dr, col = centerCol + dc;
        if (!inBounds(row, col, cols, rows)) continue;
        const i = idx(row, col, cols);
        grid[i] = currentMaterial;
        life[i] = currentMaterial === FIRE ? FIRE_LIFE : 0;
      }
    }
  }

  let painting = false;
  canvas.addEventListener("mousedown", (e) => { painting = true; paintAt(e.clientX, e.clientY); });
  window.addEventListener("mouseup", () => { painting = false; });
  window.addEventListener("mousemove", (e) => { if (painting) paintAt(e.clientX, e.clientY); });
  canvas.addEventListener("touchstart", (e) => { painting = true; const t = e.touches[0]; paintAt(t.clientX, t.clientY); e.preventDefault(); }, { passive: false });
  canvas.addEventListener("touchmove", (e) => { if (painting) { const t = e.touches[0]; paintAt(t.clientX, t.clientY); } e.preventDefault(); }, { passive: false });
  window.addEventListener("touchend", () => { painting = false; });
  window.addEventListener("resize", resize);

  const materialsEl = document.getElementById("materials");
  [SAND, WATER, WALL, WOOD, FIRE, EMPTY].forEach((mat) => {
    const btn = document.createElement("button");
    btn.className = "matBtn" + (mat === currentMaterial ? " active" : "");
    btn.textContent = MATERIAL_NAMES[mat];
    btn.dataset.mat = mat;
    btn.addEventListener("click", () => {
      currentMaterial = mat;
      document.querySelectorAll(".matBtn").forEach((b) => b.classList.toggle("active", b === btn));
    });
    materialsEl.appendChild(btn);
  });

  document.getElementById("brushSize").addEventListener("input", (e) => {
    brushSize = parseInt(e.target.value, 10);
    document.getElementById("brushLabel").textContent = brushSize;
  });

  document.getElementById("pauseBtn").addEventListener("click", (e) => {
    paused = !paused;
    e.target.textContent = paused ? "▶ Resume" : "⏸ Pause";
  });

  document.getElementById("clearBtn").addEventListener("click", () => {
    grid.fill(EMPTY);
    life.fill(0);
  });

  function updateStats() {
    let counts = {};
    for (let i = 0; i < grid.length; i++) counts[grid[i]] = (counts[grid[i]] || 0) + 1;
    document.getElementById("stats").textContent =
      `Sand ${counts[SAND] || 0}  Water ${counts[WATER] || 0}  Wood ${counts[WOOD] || 0}  Fire ${counts[FIRE] || 0}`;
  }

  function loop() {
    if (!paused) {
      step(grid, life, cols, rows, tick, Math.random);
      tick++;
    }
    render();
    if (tick % 15 === 0) updateStats();
    requestAnimationFrame(loop);
  }

  resize();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
